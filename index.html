<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Deals</title>
<style>
*{box-sizing:border-box}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
body{margin:0;overflow-anchor:none;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#111827;background:#fff}
.chrome{position:sticky;top:0;z-index:15;background:#fff}
.sticky-locate{width:min(430px,100%);margin:0 auto;padding:10px 14px 0}
.locate{border:0;border-radius:999px;padding:8px 12px;background:#f97316;color:#fff;font-weight:700;font-size:12px;cursor:pointer}.locate.detected{background:transparent;color:#111827;border-radius:0;padding:0;font-size:14px;font-weight:700}
.site-header{display:flex;align-items:center;justify-content:space-between;width:min(430px,100%);margin:0 auto;padding:10px 14px 8px;background:#fff;overflow:hidden;max-height:160px;transition:max-height .2s ease,padding .2s ease,opacity .2s ease}
.chrome.compact .site-header,.chrome.compact .sticky-locate,.chrome.compact .site-nav{max-height:0;padding-top:0;padding-bottom:0;margin:0;opacity:0;pointer-events:none;overflow:hidden}
.brand-link{color:inherit;text-decoration:none}
.brand-block{display:flex;align-items:flex-start;gap:10px}
.brand-copy{display:flex;flex-direction:column;align-items:flex-start}
.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#f97316;color:#fff;font-weight:800}
.brand-block h1{margin:0;font-size:18px}
.brand-block p{margin:2px 0 0;color:#6b7280;font-size:12px}
.header-actions{margin-left:auto}
.menu-btn{border:0;background:transparent;padding:0;width:auto;height:auto;font-size:28px;line-height:1;cursor:pointer;color:#111827}
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:90}
.nav-backdrop.open{display:block}
.site-nav{position:fixed;top:0;right:0;left:auto;width:min(300px,80vw);height:100dvh;background:#fff;z-index:91;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:24px;transform:translateX(100%);transition:transform .25s ease;text-align:center}
.site-nav.open{transform:translateX(0)}
.site-nav a{color:#111827;font-size:18px;font-weight:800;text-decoration:none}
.nav-close{position:absolute;top:14px;right:14px;border:0;background:transparent;font-size:34px;line-height:1;cursor:pointer;color:#111827;z-index:92}
.sticky-tools{width:min(430px,100%);margin:0 auto;padding:0 14px 10px;background:#fff}
.status{display:none}
.categories{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px}
.chip{flex:0 0 auto;border:1px solid transparent;border-radius:16px;padding:8px 10px;background:#f3f4f6;color:#374151;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.chip.active{background:#fff;color:#c2410c;border-color:#f97316}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;justify-items:stretch}
.filters select{width:100%;padding:11px 12px;border:1px solid #111827;border-radius:14px;background:#fff;color:#111827;font:inherit;font-size:13px}
.app{width:min(430px,100%);margin:0 auto;padding:8px 14px 28px}
.offers{display:grid;gap:12px}
.offer{position:relative;border:1px solid #d1d5db;border-radius:6px;padding:14px 18px;background:#fff;overflow:visible}
.offer:before,.offer:after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid #d1d5db;transform:translateY(-50%);z-index:2;pointer-events:none}
.offer:before{left:-10px;border-left-color:#fff}
.offer:after{right:-10px;border-right-color:#fff}
.offer-perforation{position:absolute;left:16px;right:16px;top:50%;border-top:1px dashed #d1d5db;pointer-events:none}
.offer-brand{padding-right:88px;margin-bottom:6px}
.badge{position:absolute;top:14px;right:14px;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:800}
.badge.c0{background:#fee2e2;color:#b91c1c}.badge.c1{background:#ffedd5;color:#c2410c}
.badge.c2{background:#fef3c7;color:#b45309}.badge.c3{background:#ecfccb;color:#4d7c0f}
.badge.c4{background:#d1fae5;color:#047857}.badge.c5{background:#ccfbf1;color:#0f766e}
.badge.c6{background:#cffafe;color:#0e7490}.badge.c7{background:#dbeafe;color:#1d4ed8}
.badge.c8{background:#e0e7ff;color:#4338ca}.badge.c9{background:#ede9fe;color:#6d28d9}
.badge.c10{background:#fae8ff;color:#a21caf}.badge.c11{background:#fce7f3;color:#be185d}
.badge.c12{background:#e2e8f0;color:#334155}
.business{color:#4b5563;font-size:13px;font-weight:600}
.offer h2{margin:0 0 4px;font-size:20px}
.offer .desc{margin:0;color:#6b7280;font-size:13px}
.offer-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid #f3f4f6}
.area,.distance,.ends{display:inline-flex;align-items:center;min-height:32px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.area{background:#fef9c3;color:#854d0e}.distance{background:#dcfce7;color:#15803d}.ends{background:#ffe4e6;color:#be123c}
.confirm-note{margin:10px 0 0;color:#6b7280;font-size:12px;font-style:italic}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.map-link,.call-link,.share-btn{display:flex;align-items:center;justify-content:center;padding:12px 8px;border:0;border-radius:12px;font-weight:800;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit}
.map-link{background:#2563eb;color:#fff}.call-link{background:#16a34a;color:#fff}
.share-btn{background:#fff7ed;color:#c2410c;border:1px solid #f97316}
.empty{padding:36px 16px;text-align:center;color:#6b7280}
.footer{margin-top:18px;text-align:center;color:#9ca3af;font-size:12px}
.footer a{color:#6b7280;text-decoration:none;font-weight:700}
@media(min-width:900px){
.chrome{display:flex;flex-wrap:wrap;align-items:center;position:relative;overflow-anchor:none}.sticky-tools{position:sticky;top:0;z-index:16}
.site-header{width:auto;flex:1;order:1;max-height:120px;padding:18px 16px 10px 28px;flex-wrap:nowrap}
.menu-btn{display:none}
.nav-backdrop,.nav-close{display:none!important}.site-nav,.site-nav.open{position:static;transform:none;width:auto;height:auto;order:1;justify-content:flex-start;align-items:center;display:flex;flex-direction:row;gap:14px;padding:0;margin:0 16px 0 0;background:transparent}.site-nav a{font-size:13px;font-weight:700}
.sticky-locate{order:2;width:auto;margin:0 28px 0 auto;padding:18px 0 10px}
.sticky-tools{order:3;width:100%;padding:0 28px 12px}.filters{max-width:380px;margin:0}.chrome.compact .filters{display:none}
.categories{flex-wrap:wrap;overflow:visible}
.app{width:100%;padding:8px 28px 40px}
.offers{grid-template-columns:1fr 1fr;gap:16px}
.brand-mark{width:44px;height:44px}
.brand-block h1{font-size:22px}
}
</style>
</head>
<body>
<div class="chrome" id="chrome">
  <div class="sticky-locate"><button class="locate" id="locationButton">Allow location</button></div>
  <header class="site-header">
    <a class="brand-link" href="index.html">
      <div class="brand-block">
        <div class="brand-mark">CM</div>
        <div class="brand-copy">
          <h1>Central Marketplace</h1>
          <p>Local deals around you</p>
        </div>
      </div>
    </a>
    <div class="header-actions"><button class="menu-btn" id="menuButton" type="button" aria-label="Menu">☰</button></div>
  </header>
  <div class="nav-backdrop" id="navBackdrop"></div>
  <nav class="site-nav" id="siteNav">
    <button class="nav-close" id="navClose" type="button" aria-label="Close">×</button>
    <a href="how-it-works.html">How it works</a>
    <a href="list-your-business.html">List your business</a>
    <a href="we-are-hiring.html">We're hiring</a>
  </nav>
  <div class="sticky-tools">
    <div class="categories" id="categories"></div>
    <div class="filters">
      <label class="sr-only" for="locationFilter">Location</label>
      <select id="locationFilter"><option value="">All locations</option></select>
      <label class="sr-only" for="distanceFilter">Distance</label>
      <select id="distanceFilter">
        <option value="">All distances</option>
        <option value="5">All distances (&lt; 5 km)</option>
        <option value="10">All distances (&lt; 10 km)</option>
        <option value="15">All distances (&lt; 15 km)</option>
        <option value="20">All distances (&lt; 20 km)</option>
      </select>
    </div>
  </div>
</div>
<main class="app">
  <p id="headline" class="sr-only">Exclusive discounts near you</p>
  <div id="status" class="status">Allow location access to find nearby deals.</div>
  <section id="offers" class="offers"></section>
  <div class="footer">
    <a href="how-it-works.html">How it works</a> ·
    <a href="list-your-business.html">List your business</a> ·
    <a href="we-are-hiring.html">We're hiring</a>
    <div>© Central Marketplace</div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
